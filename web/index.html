<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Buddha++ Explorer</title>
  </head>
  <body>
    <aside id="panel">
      <header>
        <h1>Buddha · explorer</h1>
        <button type="button" class="secondary" id="close">Close</button>
      </header>
      <form id="controls">
        <fieldset>
          <legend>Window</legend>
          <div class="pair">
            <label>Center Re<input name="cre" type="number" required /></label>
            <label>Center Im<input name="cim" type="number" required /></label>
          </div>
          <label
            >Span<input
              name="span"
              type="number"
              title="Complex units across the view's shorter side"
              required
          /></label>
        </fieldset>
        <fieldset>
          <legend>Channel iterations</legend>
          <div class="pair">
            <label>R min<input name="lowr" type="number" required /></label>
            <label>R max<input name="highr" type="number" required /></label>
            <label>G min<input name="lowg" type="number" required /></label>
            <label>G max<input name="highg" type="number" required /></label>
            <label>B min<input name="lowb" type="number" required /></label>
            <label>B max<input name="highb" type="number" required /></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Sampler</legend>
          <label
            title="Metropolis chains, or naive uniform samples each drawn once: the unbiased Buddhabrot, which finds little when zoomed in"
            >Sampler<select name="sampler">
              <option value="metropolis">Metropolis</option>
              <option value="naive">Naive</option>
            </select></label
          >
        </fieldset>
        <fieldset id="metropolis">
          <legend>Metropolis sampler</legend>
          <label title="Mutation radius, in percent of the view's shorter side"
            >Radius %<input name="radius" type="number" required
          /></label>
          <label title="Density exponent of the orbit length L (target L^a C^b)"
            >Length exp.<input name="exponent_l" type="number" required
          /></label>
          <label title="Density exponent of the orbit points in the window C (target L^a C^b)"
            >Window exp.<input name="exponent_c" type="number" required
          /></label>
          <label title="Proposals per chain, as a multiple of max(256 C, 2 L)"
            >Chain length ×<input name="chain_scale" type="number" required
          /></label>
          <label title="How chains find their first point"
            >Seeds<select name="seeding">
              <option value="newton">Newton</option>
              <option value="walk">Random walk</option>
              <option value="uniform">Uniform</option>
            </select></label
          >
        </fieldset>
        <fieldset>
          <legend>Display</legend>
          <label
            class="slider"
            title="Exposure in stops: each +1 doubles the tone curve, and the brightest pixels clip"
            >Exposure<input name="exposure" type="range" /><output id="exposure-value"></output
          ></label>
          <label class="slider" title="Exponent of the tone curve: lower values lift faint orbits"
            >Gamma<input name="gamma" type="range" /><output id="gamma-value"></output
          ></label>
          <label class="slider"
            >Saturation<input name="saturation" type="range" /><output
              id="saturation-value"></output
          ></label>
          <label class="slider" title="Detail a few pixels across, in the midtones only"
            >Texture<input name="texture" type="range" /><output id="texture-value"></output
          ></label>
          <label class="slider" title="Pixel-scale detail (unsharp mask); negative values soften"
            >Sharpness<input name="sharpness" type="range" /><output id="sharpness-value"></output
          ></label>
        </fieldset>
        <div class="actions">
          <button type="button" id="pause" disabled>Pause</button>
          <button type="button" class="secondary" id="preset">Reset</button>
          <button
            type="button"
            class="secondary"
            id="export"
            disabled
            title="Save the image on screen as a lossless WebP, with the settings embedded">
            Export
          </button>
        </div>
      </form>
      <section id="stats">
        <p id="message" role="status">Starting…</p>
        <button type="button" id="retry" hidden>Retry GPU</button>
        <dl id="measures"></dl>
      </section>
    </aside>
    <main>
      <div id="viewport" title="Drag to pan; scroll or pinch to zoom">
        <canvas id="image" aria-label="Progressive Buddhabrot preview"></canvas>
      </div>
    </main>
    <button type="button" id="menu" aria-controls="panel" aria-expanded="false">Menu</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
