<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buddha browser prototype</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #101214; color: #d8dde0; }
    * { box-sizing: border-box; }
    body { margin: 0; display: grid; grid-template-columns: 248px 1fr; height: 100vh; }
    aside { padding: 8px; overflow: auto; border-right: 1px solid #30363b; }
    h1 { font-size: .9rem; font-weight: 600; margin: 2px 0 10px; }
    fieldset { border: 0; border-top: 1px solid #30363b; margin: 6px 0; padding: 5px 0 2px; }
    legend { padding: 0 5px 0 0; color: #929da5; font-size: .68rem; text-transform: uppercase; }
    label { display: grid; grid-template-columns: 1fr 104px; align-items: center; gap: 4px; margin: 2px 0; font-size: .72rem; color: #b3bdc4; }
    input { width: 100%; margin: 0; color: #e3e8eb; font: inherit; }
    input[type=number] { height: 22px; padding: 0 2px; border: 0; border-bottom: 1px solid #4b565d; border-radius: 0; background: transparent; text-align: right; appearance: textfield; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { appearance: none; margin: 0; }
    input[type=number]:focus { outline: 0; border-bottom-color: #9fb5c1; }
    input[type=number]:invalid { border-bottom-color: #af674f; }
    input[type=range] { height: 20px; padding: 0; border: 0; background: transparent; appearance: none; }
    input[type=range]::-webkit-slider-runnable-track { height: 2px; background: #4b565d; }
    input[type=range]::-webkit-slider-thumb { width: 8px; height: 12px; margin-top: -5px; border: 0; border-radius: 0; background: #9fb5c1; appearance: none; }
    input[type=range]::-moz-range-track { height: 2px; background: #4b565d; }
    input[type=range]::-moz-range-thumb { width: 8px; height: 12px; border: 0; border-radius: 0; background: #9fb5c1; }
    label.slider { grid-template-columns: 1fr 77px 34px; }
    output { text-align: right; font-variant-numeric: tabular-nums; }
    button { height: 27px; padding: 2px 7px; border: 1px solid #495c68; border-radius: 0; color: #e5edf1; background: #263b48; cursor: pointer; font: inherit; font-size: .72rem; }
    button:hover { background: #345365; }
    button:disabled { opacity: .5; cursor: default; }
    button.secondary { background: #202629; border-color: #3b454b; }
    .actions { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 8px; }
    main { min-width: 0; display: flex; flex-direction: column; }
    #viewport { flex: 1; min-height: 0; display: grid; place-items: center; background: #050607; overflow: hidden; cursor: grab; touch-action: none; }
    #viewport.dragging { cursor: grabbing; }
    #image { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; image-rendering: auto; pointer-events: none; }
    footer { display: flex; gap: 10px; padding: 4px 7px; border-top: 1px solid #30363b; color: #929da5; font-size: .65rem; white-space: nowrap; overflow: hidden; }
    #message { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
    #status { flex: 1 1 auto; text-align: right; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    @media (max-width: 650px) { body { display: flex; flex-direction: column; height: 100dvh; } aside { max-height: 42vh; border-right: 0; border-bottom: 1px solid #30363b; } footer { display: block; } #status { text-align: left; } }
  </style>
</head>
<body>
  <aside>
    <h1>Buddha · Metal preview</h1>
    <form id="controls">
      <fieldset>
        <legend>Window</legend>
        <div class="pair">
          <label>Center Re<input name="cre" type="number" step="any" value="0" required></label>
          <label>Center Im<input name="cim" type="number" step="any" value="0" required></label>
        </div>
        <label>Scale<input name="scale" type="number" min="0.000001" step="any" title="Pixels per complex unit" required></label>
      </fieldset>
      <fieldset>
        <legend>Channel iterations</legend>
        <div class="pair">
          <label>R min<input name="lowr" type="number" min="0" max="99999" step="1" value="512" required></label>
          <label>R max<input name="highr" type="number" min="1" max="100000" step="1" value="8192" required></label>
          <label>G min<input name="lowg" type="number" min="0" max="99999" step="1" value="128" required></label>
          <label>G max<input name="highg" type="number" min="1" max="100000" step="1" value="2048" required></label>
          <label>B min<input name="lowb" type="number" min="0" max="99999" step="1" value="32" required></label>
          <label>B max<input name="highb" type="number" min="1" max="100000" step="1" value="512" required></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Display</legend>
        <label class="slider" title="Midtone lift with protected highlights">Brightness<input name="brightness" type="range" min="-100" max="100" value="25"><output id="brightness-value">+25</output></label>
        <label class="slider">Contrast<input name="contrast" type="range" min="-100" max="100" value="10"><output id="contrast-value">+10</output></label>
        <label class="slider">Saturation<input name="saturation" type="range" min="-100" max="100" value="50"><output id="saturation-value">+50</output></label>
        <label class="slider" title="Broad midtone local contrast">Clarity<input name="clarity" type="range" min="-100" max="100" value="50"><output id="clarity-value">+50</output></label>
        <label class="slider" title="Fine detail without broad halos">Texture<input name="texture" type="range" min="-100" max="100" value="50"><output id="texture-value">+50</output></label>
      </fieldset>
      <div class="actions">
        <button type="submit" id="start">Start</button>
        <button type="button" class="secondary" id="stop">Stop</button>
        <button type="button" class="secondary" id="preset">Reset</button>
      </div>
    </form>
  </aside>
  <main>
    <div id="viewport" title="Drag to pan; scroll or pinch to zoom"><canvas id="image" aria-label="Progressive Buddhabrot preview"></canvas></div>
    <footer><span id="message">Ready</span><span id="status"></span></footer>
  </main>
  <script>
    const form = document.getElementById('controls');
    const startButton = document.getElementById('start');
    const viewport = document.getElementById('viewport');
    const image = document.getElementById('image');
    const message = document.getElementById('message');
    const statusLine = document.getElementById('status');
    let lastFrameRevision = 0;
    let activeRenderId = 0;
    let frameLoading = false;
    let renderTimer;
    let lastViewport;
    let requestNumber = 0;
    let commandQueue = Promise.resolve();
    let displayTimer;
    let displayDirty = false;
    let displayTouched = false;
    let displayInitialized = false;
    let renderDirty = false;
    let currentPhase = 'idle';
    const pointers = new Map();
    let gesture;

    function viewportPixels() {
      const ratio = window.devicePixelRatio || 1;
      let width = Math.max(1, Math.round(viewport.clientWidth * ratio));
      let height = Math.max(1, Math.round(viewport.clientHeight * ratio));
      const limit = 2000000;
      if (width * height > limit) {
        const factor = Math.sqrt(limit / (width * height));
        width = Math.max(1, Math.floor(width * factor));
        height = Math.max(1, Math.floor(height * factor));
      }
      return {width, height};
    }

    function fullViewPreset() {
      const {width, height} = viewportPixels();
      form.elements.cre.value = 0;
      form.elements.cim.value = 0;
      form.elements.scale.value = Math.min(width, height) / 4;
      for (const [name, value] of Object.entries({lowr: 512, highr: 8192,
           lowg: 128, highg: 2048, lowb: 32, highb: 512}))
        form.elements[name].value = value;
      for (const [name, value] of Object.entries({brightness: 25, contrast: 10,
           saturation: 50, clarity: 50, texture: 50}))
        form.elements[name].value = value;
      updateDisplayLabels();
    }

    function updateStartButton() {
      startButton.textContent = ['starting', 'running', 'pausing'].includes(currentPhase) ? 'Pause' : 'Start';
      startButton.disabled = ['pausing', 'resuming', 'stopping'].includes(currentPhase);
    }

    const displayNames = ['brightness', 'contrast', 'saturation', 'clarity', 'texture'];
    function updateDisplayLabels() {
      for (const name of ['brightness', 'contrast', 'saturation', 'clarity', 'texture']) {
        const value = Number(form.elements[name].value);
        document.getElementById(`${name}-value`).textContent = value > 0 ? `+${value}` : `${value}`;
      }
    }

    function formatSamples(samples) {
      const units = ['', 'K', 'M', 'G', 'T', 'P'];
      let unit = 0;
      while (samples >= 1000 && unit < units.length - 1) {
        samples /= 1000;
        ++unit;
      }
      samples = Number(samples.toPrecision(3));
      if (samples >= 1000 && unit < units.length - 1) {
        samples /= 1000;
        ++unit;
      }
      return `${samples}${units[unit]}`;
    }

    function format3(value) { return `${Number(value.toPrecision(3))}`; }

    function displayData() {
      return Object.fromEntries(displayNames.map(name => [name, Number(form.elements[name].value)]));
    }

    async function command(path, body) {
      const response = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'},
                                     body: JSON.stringify(body || {})});
      if (!response.ok) throw new Error(await response.text());
      return response.json();
    }

    function enqueueCommand(path, body) {
      const next = commandQueue.then(() => command(path, body));
      commandQueue = next.catch(() => {});
      return next;
    }

    async function sendDisplay() {
      clearTimeout(displayTimer);
      displayDirty = false;
      try {
        await enqueueCommand('/display', displayData());
        return true;
      } catch (error) {
        displayDirty = true;
        message.textContent = error.message;
        return false;
      }
    }

    function scheduleDisplay() {
      displayDirty = true;
      displayTouched = true;
      message.textContent = 'Updating display…';
      clearTimeout(displayTimer);
      displayTimer = setTimeout(sendDisplay, 80);
    }

    form.addEventListener('input', event => {
      if (displayNames.includes(event.target.name)) {
        updateDisplayLabels();
        scheduleDisplay();
      } else {
        renderDirty = true;
      }
    });

    function validSettings(report) {
      for (const input of form.querySelectorAll('input')) input.setCustomValidity('');
      for (const color of ['r', 'g', 'b']) {
        const low = form.elements[`low${color}`];
        const high = form.elements[`high${color}`];
        if (Number(low.value) >= Number(high.value))
          high.setCustomValidity('Maximum must exceed minimum');
      }
      return report ? form.reportValidity() : form.checkValidity();
    }

    async function startRender() {
      clearTimeout(renderTimer);
      if (!validSettings(true)) return;
      const currentRequest = ++requestNumber;
      if (displayDirty && !await sendDisplay()) return;
      if (currentRequest !== requestNumber) return;
      const data = Object.fromEntries(new FormData(form));
      for (const name of ['cre', 'cim', 'scale', 'lowr', 'lowg', 'lowb',
                          'highr', 'highg', 'highb'])
        data[name] = Number(data[name]);
      Object.assign(data, viewportPixels());
      try {
        currentPhase = 'starting';
        updateStartButton();
        const status = await enqueueCommand('/render', data);
        if (currentRequest === requestNumber) {
          activeRenderId = status.render_id;
          currentPhase = status.phase;
          renderDirty = false;
          updateStartButton();
          message.textContent = 'Starting render ' + activeRenderId + '…';
        }
      } catch (error) { message.textContent = error.message; }
    }

    function scheduleRender(delay = 180) {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(startRender, delay);
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      if (['starting', 'running'].includes(currentPhase)) {
        currentPhase = 'pausing';
        updateStartButton();
        enqueueCommand('/pause').then(status => {
          currentPhase = status.phase;
          updateStartButton();
        }).catch(error => { message.textContent = error.message; });
      } else if (currentPhase === 'paused' && !renderDirty) {
        currentPhase = 'resuming';
        updateStartButton();
        enqueueCommand('/resume').then(status => {
          currentPhase = status.phase;
          updateStartButton();
        }).catch(error => { message.textContent = error.message; });
      } else if (!['pausing', 'resuming', 'stopping'].includes(currentPhase)) {
        startRender();
      }
    });

    document.getElementById('stop').addEventListener('click', async () => {
      clearTimeout(renderTimer);
      ++requestNumber;
      currentPhase = 'stopping';
      updateStartButton();
      try {
        const status = await enqueueCommand('/stop');
        currentPhase = status.phase;
        updateStartButton();
      }
      catch (error) { message.textContent = error.message; }
    });
    document.getElementById('preset').addEventListener('click', () => {
      clearTimeout(renderTimer);
      fullViewPreset();
      renderDirty = true;
      scheduleDisplay();
    });

    function viewState() {
      const {width, height} = viewportPixels();
      return {width, height, cre: Number(form.elements.cre.value),
              cim: Number(form.elements.cim.value), scale: Number(form.elements.scale.value)};
    }

    function imagePoint(clientX, clientY, view) {
      const rect = viewport.getBoundingClientRect();
      return {x: (clientX - rect.left) * view.width / rect.width,
              y: (clientY - rect.top) * view.height / rect.height};
    }

    function complexPoint(point, view) {
      // The TIFF orientation maps image y to real and image x to imaginary.
      return {re: view.cre + (point.y - view.height / 2) / view.scale,
              im: view.cim + (point.x - view.width / 2) / view.scale};
    }

    function setView(cre, cim, scale) {
      if (![cre, cim, scale].every(Number.isFinite) || scale <= 0) return false;
      form.elements.cre.value = Number(cre.toPrecision(15));
      form.elements.cim.value = Number(cim.toPrecision(15));
      form.elements.scale.value = Number(scale.toPrecision(15));
      return true;
    }

    function pointerMidpoint() {
      const points = [...pointers.values()];
      return {x: (points[0].x + points[1].x) / 2,
              y: (points[0].y + points[1].y) / 2,
              distance: Math.hypot(points[0].x - points[1].x,
                                   points[0].y - points[1].y)};
    }

    function beginGesture() {
      if (!validSettings(false)) return;
      const view = viewState();
      if (pointers.size === 1) {
        const pointer = [...pointers.values()][0];
        gesture = {view, x: pointer.x, y: pointer.y, moved: false};
      } else if (pointers.size === 2) {
        const mid = pointerMidpoint();
        gesture = {view, x: mid.x, y: mid.y, distance: mid.distance, moved: false};
      }
    }

    viewport.addEventListener('pointerdown', event => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      if (pointers.size >= 2) return;
      clearTimeout(renderTimer);
      viewport.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, {x: event.clientX, y: event.clientY});
      viewport.classList.add('dragging');
      beginGesture();
    });

    viewport.addEventListener('pointermove', event => {
      if (!pointers.has(event.pointerId) || !gesture) return;
      pointers.set(event.pointerId, {x: event.clientX, y: event.clientY});
      if (pointers.size === 1 && gesture.distance === undefined) {
        const point = [...pointers.values()][0];
        if (Math.hypot(point.x - gesture.x, point.y - gesture.y) <= 3 && !gesture.moved) return;
        const start = imagePoint(gesture.x, gesture.y, gesture.view);
        const now = imagePoint(point.x, point.y, gesture.view);
        if (setView(gesture.view.cre - (now.y - start.y) / gesture.view.scale,
                    gesture.view.cim - (now.x - start.x) / gesture.view.scale,
                    gesture.view.scale))
          gesture.moved = true;
      } else if (pointers.size === 2 && gesture.distance > 0) {
        const mid = pointerMidpoint();
        const scale = gesture.view.scale * mid.distance / gesture.distance;
        const anchor = complexPoint(imagePoint(gesture.x, gesture.y, gesture.view), gesture.view);
        const now = imagePoint(mid.x, mid.y, gesture.view);
        if (setView(anchor.re - (now.y - gesture.view.height / 2) / scale,
                    anchor.im - (now.x - gesture.view.width / 2) / scale, scale))
          gesture.moved = true;
      }
    });

    function endPointer(event) {
      if (!pointers.delete(event.pointerId)) return;
      if (gesture?.moved) scheduleRender();
      gesture = undefined;
      if (pointers.size) beginGesture();
      else viewport.classList.remove('dragging');
    }
    viewport.addEventListener('pointerup', endPointer);
    viewport.addEventListener('pointercancel', endPointer);

    viewport.addEventListener('wheel', event => {
      event.preventDefault();
      if (!validSettings(false)) return;
      const view = viewState();
      const point = imagePoint(event.clientX, event.clientY, view);
      const anchor = complexPoint(point, view);
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? 800 : 1);
      const scale = view.scale * Math.exp(Math.max(-2, Math.min(2, -delta * 0.001)));
      if (setView(anchor.re - (point.y - view.height / 2) / scale,
                  anchor.im - (point.x - view.width / 2) / scale, scale))
        scheduleRender();
    }, {passive: false});

    lastViewport = viewportPixels();
    new ResizeObserver(() => {
      const next = viewportPixels();
      if (next.width === lastViewport.width && next.height === lastViewport.height) return;
      const previous = lastViewport;
      lastViewport = next;
      if (!validSettings(false)) return;
      form.elements.scale.value = Number((Number(form.elements.scale.value) *
          Math.min(next.width, next.height) / Math.min(previous.width, previous.height)).toPrecision(15));
      if (activeRenderId) scheduleRender(250);
    }).observe(viewport);

    async function poll() {
      try {
        const response = await fetch('/status', {cache: 'no-store'});
        const status = await response.json();
        if (!displayInitialized && status.display) {
          if (!displayTouched) {
            for (const name of displayNames) form.elements[name].value = status.display[name];
            updateDisplayLabels();
          }
          displayInitialized = true;
        }
        activeRenderId = status.render_id;
        currentPhase = status.phase;
        updateStartButton();
        const rate = status.elapsed > 0 ? format3(status.samples / status.elapsed / 1e6) : '0';
        const batchRate = status.batch_seconds > 0 ? format3(status.samples / status.batch_seconds / 1e6) : '0';
        const size = status.width ? `${status.width}x${status.height} pixels` : '—';
        const previewMs = status.preview_count ? format3(status.preview_seconds * 1000 / status.preview_count) : '0';
        statusLine.textContent = `${status.phase} · ${size} · ${rate}M/s overall · ${batchRate}M/s batches · ${previewMs}ms avg preview · ${formatSamples(status.samples)} samples`;
        if (status.error) message.textContent = status.error;
        if (status.frame_render_id === activeRenderId && status.frame_revision !== lastFrameRevision && !frameLoading) {
          frameLoading = true;
          const renderId = activeRenderId;
          try {
            const frameResponse = await fetch(`/frame.rgba?revision=${status.frame_revision}`, {cache: 'no-store'});
            if (!frameResponse.ok) throw new Error(await frameResponse.text());
            const pixels = new Uint8ClampedArray(await frameResponse.arrayBuffer());
            if (pixels.length !== status.width * status.height * 4) throw new Error('Invalid frame size');
            if (renderId === activeRenderId) {
              image.width = status.width;
              image.height = status.height;
              image.getContext('2d').putImageData(new ImageData(pixels, status.width, status.height), 0, 0);
              lastFrameRevision = status.frame_revision;
              message.textContent = `Showing render ${activeRenderId}`;
            }
          } catch (error) {
            message.textContent = 'Preview: ' + error.message;
          } finally { frameLoading = false; }
        }
      } catch (error) { statusLine.textContent = 'Renderer disconnected'; }
    }

    fullViewPreset();
    poll();
    setInterval(poll, 1000);
  </script>
</body>
</html>
