name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Check formatting
        run: yarn format:check
      - name: Lint
        run: yarn lint
      - name: Type check and build
        run: yarn build

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The commit hook's native checks (whitespace and C++ formatting), applied to every
      # change since the base: soft-reset to it so the whole change is staged, then run the hook.
      - name: Lint
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          xcrun --find clang-format && xcrun clang-format --version
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare with; skipping."
            exit 0
          fi
          git reset --soft "$(git merge-base "$BASE" HEAD)"
          python3 .githooks/pre-commit --skip-web
          git reset --soft "$GITHUB_SHA"

      - name: Install dependencies
        run: brew install boost libtiff zstd

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # Includes kernel-consistency (CPU renderer vs the kernel shared with buddha-metal) and
      # metal-consistency (GPU vs the shared kernel; skipped when the runner has no Metal device).
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # buddha-metal compiles its kernel at run time. Compiling it here as well catches Metal
      # errors in core/buddha_kernel.h even when the runner cannot execute Metal.
      - name: Compile the Metal kernel ahead of time
        run: |
          if ! xcrun -sdk macosx --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal -c build/generated/buddha.metal -o build/buddha.air
